<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#E3350D" />
  <title>EliteTCG - Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #fff;
      color: #111;
    }
    .container { text-align: center; padding: 2rem; max-width: 400px; }
    .logo { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 2rem; }
    .logo span { color: #E3350D; }
    .icon {
      width: 64px; height: 64px; margin: 0 auto 1.5rem;
      background: #f3f4f6; border-radius: 1rem;
      display: flex; align-items: center; justify-content: center;
    }
    .icon svg { width: 28px; height: 28px; color: #9ca3af; }
    h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem; }
    p { color: #6b7280; font-size: 0.9375rem; line-height: 1.5; }
    button {
      margin-top: 1.5rem;
      padding: 0.75rem 2rem;
      background: #E3350D;
      color: #fff;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.875rem;
      transition: background 0.15s;
    }
    button:hover { background: #CC2D0A; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Elite<span>TCG</span></div>
    <div class="icon">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
      </svg>
    </div>
    <h1>You're Offline</h1>
    <p>Check your internet connection and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
